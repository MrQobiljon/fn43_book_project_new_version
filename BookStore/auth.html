<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Avtorizatsiya | LIBERTY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header-footer.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-lg main-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">LIBERTY.</a>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center g-5">
      
      <div class="col-md-5">
        <div class="bg-white p-4 border h-100">
          <h4 class="fw-bold mb-4">Tizimga kirish</h4>
          <form>
            <div class="mb-3">
              <label class="form-label small fw-bold">Elektron pochta</label>
              <input type="email" class="form-control" name="login_email">
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold">Parol</label>
              <input type="password" class="form-control" name="login_password">
            </div>
            <button type="submit" class="custom-btn-primary w-100">Kirish</button>
          </form>
        </div>
      </div>

      <div class="col-md-5">
        <div class="bg-white p-4 border h-100">
          <h4 class="fw-bold mb-4">Ro'yxatdan o'tish</h4>
          <form>
            <div class="mb-3">
              <label class="form-label small fw-bold">F.I.SH</label>
              <input type="text" class="form-control" name="reg_name">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Elektron pochta</label>
              <input type="email" class="form-control" name="reg_email">
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold">Yangi parol</label>
              <input type="password" class="form-control" name="reg_password">
            </div>
            <button type="submit" class="custom-btn-primary w-100">Akkaunt yaratish</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center small">&copy; 2026 LIBERTY Bookstore.</div>
  </footer>

</body>
</html>
